# Modified downstream from nginx/nginx-otel v0.1.2 for SG5.
# See MODIFICATIONS-SG5.md; inherited SG4 history remains documented; Apache-2.0.
# SPDX-License-Identifier: Apache-2.0
# Downstream SG5 dual-runtime CI: preserve the SG4.17 qualified baseline and
# add conservative upstream failure-classification integration coverage on exact
# vanilla NGINX 1.31.1 and OpenResty 1.31.1.1.
name: SG5 dual runtime + failure classification

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  OTELCOL_VERSION: 0.159.0

jobs:
  vanilla-nginx-build-test:
    name: Vanilla NGINX 1.31.1 regression
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl jq libc-ares-dev libpcre2-dev \
            iptables libssl-dev perl pkg-config zlib1g-dev

      - name: Checkout exact NGINX 1.31.1 release commit
        uses: actions/checkout@v4
        with:
          repository: nginx/nginx
          ref: d44205284fa41662da803b796d6056fc1e59b1f3
          path: nginx
          persist-credentials: false

      - name: Build vanilla NGINX 1.31.1
        working-directory: nginx
        run: |
          auto/configure \
            --with-compat \
            --with-debug \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_v3_module
          make -j2

      - name: Verify vanilla NGINX identity and pristine tracked core
        run: |
          test "$(git -C nginx rev-parse HEAD)" = "d44205284fa41662da803b796d6056fc1e59b1f3"
          nginx/objs/nginx -V 2>&1 | tee nginx-version.txt
          grep -Fq 'nginx/1.31.1' nginx-version.txt
          git -C nginx diff --exit-code -- .

      - name: Build ngx_otel_module against vanilla NGINX
        run: |
          mkdir -p build
          cd build
          cmake \
            -DNGX_OTEL_NGINX_BUILD_DIR="${GITHUB_WORKSPACE}/nginx/objs" \
            -DNGX_OTEL_DEV=ON \
            ..
          make -j2
          test -f ngx_otel_module.so
          ldd ngx_otel_module.so | tee module-nginx-ldd.txt
          ! grep -Fq 'not found' module-nginx-ldd.txt
          git -C ../nginx diff --exit-code -- .

      - name: Download pinned otelcol
        run: |
          BASE=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}
          ARCHIVE=otelcol_${OTELCOL_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "${BASE}/${ARCHIVE}"
          curl -fsSLo "${ARCHIVE}.sha256" "${BASE}/${ARCHIVE}.sha256"
          EXPECTED=$(tr -d '[:space:]' < "${ARCHIVE}.sha256")
          printf '%s  %s\n' "${EXPECTED}" "${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install deterministic SG5 connect-timeout fault
        run: sudo iptables -I OUTPUT 1 -p tcp -d 127.0.0.1 --dport 18087 -j DROP

      - name: Run all vanilla NGINX regression cases
        env:
          NGX_OTEL_SG5_CONNECT_TIMEOUT: '1'
        run: |
          pytest tests/test_otel.py -vv --maxfail=1 \
            --junitxml=pytest-nginx.xml \
            --nginx=nginx/objs/nginx \
            --module=build/ngx_otel_module.so \
            --otelcol=./otelcol

      - name: Verify exactly forty-eight vanilla NGINX tests executed
        run: |
          python3 - <<'PYTEST_NGINX_SUMMARY'
          import xml.etree.ElementTree as ET

          root = ET.parse('pytest-nginx.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          print('Vanilla NGINX pytest totals:', totals)
          if totals != {'tests': 48, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('expected exactly 48 vanilla NGINX tests with zero failure/error/skip')
          PYTEST_NGINX_SUMMARY

      - name: Remove deterministic SG5 connect-timeout fault
        if: ${{ always() }}
        run: sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 18087 -j DROP || true

  openresty-build-test:
    name: OpenResty 1.31.1.1 regression
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      OPENRESTY_VERSION: 1.31.1.1
      OPENRESTY_SHA256: 65b78baadd3f0984055de89bf13f4a1932e5bfe9c31932037a134ea2b1a0ce42
      OPENRESTY_PREFIX: ${{ github.workspace }}/openresty-install
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl jq libc-ares-dev libpcre2-dev \
            iptables libssl-dev perl pkg-config zlib1g-dev

      - name: Download exact OpenResty source
        run: |
          curl --fail --show-error --location --retry 3 \
            -o "openresty-${OPENRESTY_VERSION}.tar.gz" \
            "https://openresty.org/download/openresty-${OPENRESTY_VERSION}.tar.gz"
          echo "${OPENRESTY_SHA256}  openresty-${OPENRESTY_VERSION}.tar.gz" | sha256sum -c -
          tar -xzf "openresty-${OPENRESTY_VERSION}.tar.gz"
          test -d "openresty-${OPENRESTY_VERSION}/bundle/nginx-1.31.1"

      - name: Record pristine bundled NGINX source hash
        run: |
          cd "openresty-${OPENRESTY_VERSION}"
          find bundle/nginx-1.31.1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            > "${GITHUB_WORKSPACE}/openresty-nginx-core.before.sha256"

      - name: Configure build and install OpenResty with ngx_otel_module
        run: |
          cd "openresty-${OPENRESTY_VERSION}"
          export NGX_OTEL_CMAKE_OPTS='-DNGX_OTEL_DEV=ON'
          ./configure -j2 \
            --prefix="${OPENRESTY_PREFIX}" \
            --with-compat \
            --with-debug \
            --with-http_ssl_module \
            --with-http_v2_module \
            --with-http_v3_module \
            --add-dynamic-module="${GITHUB_WORKSPACE}"
          make -j2
          make install

          OPENRESTY_NGINX="${OPENRESTY_PREFIX}/nginx/sbin/nginx"
          OPENRESTY_MODULE="$(find build -type f -name ngx_otel_module.so -print -quit)"
          LUAJIT_LIB_DIR="${OPENRESTY_PREFIX}/luajit/lib"

          test -x "${OPENRESTY_NGINX}"
          test -n "${OPENRESTY_MODULE}"
          test -f "${OPENRESTY_MODULE}"
          test -d "${LUAJIT_LIB_DIR}"
          test -e "${LUAJIT_LIB_DIR}/libluajit-5.1.so.2"

          echo "OPENRESTY_NGINX=${OPENRESTY_NGINX}" >> "${GITHUB_ENV}"
          echo "OPENRESTY_MODULE=${PWD}/${OPENRESTY_MODULE}" >> "${GITHUB_ENV}"
          echo "LUAJIT_LIB_DIR=${LUAJIT_LIB_DIR}" >> "${GITHUB_ENV}"
          echo "LD_LIBRARY_PATH=${LUAJIT_LIB_DIR}:${LD_LIBRARY_PATH:-}" >> "${GITHUB_ENV}"

      - name: Verify installed OpenResty identity ABI and runtime libraries
        run: |
          "${OPENRESTY_NGINX}" -V 2>&1 | tee openresty-version.txt
          grep -Fq 'openresty/1.31.1.1' openresty-version.txt

          ldd "${OPENRESTY_NGINX}" | tee openresty-ldd.txt
          ! grep -Fq 'not found' openresty-ldd.txt
          grep -Fq 'libluajit-5.1.so.2' openresty-ldd.txt

          ldd "${OPENRESTY_MODULE}" | tee module-openresty-ldd.txt
          ! grep -Fq 'not found' module-openresty-ldd.txt

      - name: Verify bundled NGINX source tree unchanged
        run: |
          cd "openresty-${OPENRESTY_VERSION}"
          find bundle/nginx-1.31.1 -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            > "${GITHUB_WORKSPACE}/openresty-nginx-core.after.sha256"
          cmp "${GITHUB_WORKSPACE}/openresty-nginx-core.before.sha256" \
              "${GITHUB_WORKSPACE}/openresty-nginx-core.after.sha256"

      - name: Download pinned otelcol
        run: |
          BASE=https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v${OTELCOL_VERSION}
          ARCHIVE=otelcol_${OTELCOL_VERSION}_linux_amd64.tar.gz
          curl -fsSLO "${BASE}/${ARCHIVE}"
          curl -fsSLo "${ARCHIVE}.sha256" "${BASE}/${ARCHIVE}.sha256"
          EXPECTED=$(tr -d '[:space:]' < "${ARCHIVE}.sha256")
          printf '%s  %s\n' "${EXPECTED}" "${ARCHIVE}" | sha256sum -c -
          tar -xzf "${ARCHIVE}"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Install deterministic SG5 connect-timeout fault
        run: sudo iptables -I OUTPUT 1 -p tcp -d 127.0.0.1 --dport 18087 -j DROP

      - name: Run all OpenResty-specific qualification cases first
        env:
          NGX_OTEL_OPENRESTY_TESTS: '1'
        run: |
          pytest tests/test_openresty_sg4.py -vv --maxfail=6 \
            --junitxml=pytest-openresty-qualification.xml \
            --nginx="${OPENRESTY_NGINX}" \
            --module="${OPENRESTY_MODULE}" \
            --otelcol=./otelcol

      - name: Verify all six OpenResty-specific cases executed
        run: |
          python3 - <<'PYTEST_QUAL_SUMMARY'
          import xml.etree.ElementTree as ET

          root = ET.parse('pytest-openresty-qualification.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          print('OpenResty qualification totals:', totals)
          if totals != {'tests': 6, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('expected exactly 6 OpenResty-specific tests with zero failure/error/skip')
          PYTEST_QUAL_SUMMARY

      - name: Run complete suite on installed OpenResty
        env:
          NGX_OTEL_OPENRESTY_TESTS: '1'
          NGX_OTEL_SG5_CONNECT_TIMEOUT: '1'
        run: |
          pytest tests -vv \
            --junitxml=pytest-openresty.xml \
            --nginx="${OPENRESTY_NGINX}" \
            --module="${OPENRESTY_MODULE}" \
            --otelcol=./otelcol

      - name: Verify every OpenResty qualification test executed
        run: |
          python3 - <<'PYTEST_SUMMARY'
          import xml.etree.ElementTree as ET

          root = ET.parse('pytest-openresty.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          totals = {
              key: sum(int(s.attrib.get(key, 0)) for s in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          print('OpenResty pytest totals:', totals)
          if totals != {'tests': 54, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit('expected exactly 54 OpenResty tests with zero failure/error/skip')
          PYTEST_SUMMARY

      - name: Remove deterministic SG5 connect-timeout fault
        if: ${{ always() }}
        run: sudo iptables -D OUTPUT -p tcp -d 127.0.0.1 --dport 18087 -j DROP || true

  sg5-dual-runtime-gate:
    name: SG5 dual runtime + failure classification gate
    if: ${{ always() }}
    needs:
      - vanilla-nginx-build-test
      - openresty-build-test
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require both runtime jobs to succeed
        env:
          VANILLA_NGINX_RESULT: ${{ needs.vanilla-nginx-build-test.result }}
          OPENRESTY_RESULT: ${{ needs.openresty-build-test.result }}
        run: |
          echo "vanilla-nginx-build-test=${VANILLA_NGINX_RESULT}"
          echo "openresty-build-test=${OPENRESTY_RESULT}"
          test "${VANILLA_NGINX_RESULT}" = success
          test "${OPENRESTY_RESULT}" = success
          echo 'PASS: SG5 vanilla NGINX 1.31.1 and OpenResty 1.31.1.1 failure-classification gates both succeeded'
